<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Page not found | Shristi Estate</title>
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1e3350;
    --muted: #727982;
    --line: #d9dbe0;
    --btn: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070C1E;
      --fg: #e8eaee;
      --muted: #8b919d;
      --line: #343842;
      --btn: #0f172a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; width: 100vw; overflow-x: hidden; padding: 20px 16px; margin: 0;
  }
  main {
    width: 100%; max-width: 860px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; margin: auto;
  }
  .header-area { width: 100%; max-width: 800px; margin: 0 auto; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--btn); border-radius: 12px; padding: 8px 16px 8px 12px;
    margin-bottom: 12px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .brand svg { display: block; height: 38px; width: auto; }
  .brand .name { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; color: var(--fg); }
  .brand .name span { font-weight: 500; color: var(--muted); }
  h1 { font-size: clamp(2.2rem, 6vw, 3.2rem); margin: 0 0 6px; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 6px; color: var(--muted); font-size: 1.05rem; }
  #status { font-size: .9rem; margin: 0 0 12px; min-height: 1.3em; color: var(--muted); }
  #status.online { color: #2f9e5b; }

  /* Full Game Stage - No panel / box enclosing it */
  .game-stage {
    width: 100%; max-width: 960px; margin: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 0;
  }
  canvas {
    display: block; width: 100%; height: auto;
    aspect-ratio: 640 / 300;
    max-height: 58vh;
    touch-action: none; cursor: pointer; outline: none;
    user-select: none; -webkit-user-select: none;
  }
  .hint { font-size: .85rem; color: var(--muted); margin: 12px 0 0; text-align: center; }

  .actions { display: flex; gap: 12px; justify-content: center; margin-top: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  button, a.btn {
    font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--btn); color: var(--fg);
    cursor: pointer; text-decoration: none; touch-action: manipulation;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  button:active, a.btn:active { transform: translateY(1px); }
  .primary { background: #1e3350; border-color: #1e3350; color: #fff; }
</style>
</head>
<body>

<main>
  <div class="header-area">
    <div class="brand">
      <svg id="brandMark" viewBox="336 234 353 342" aria-hidden="true"></svg>
      <div class="name">Shristi <span>Estate</span></div>
    </div>
    <h1>404 – Page not found</h1>
    <p class="sub">This page isn't available right now. Sink a few shots while you wait.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="game-stage">
    <canvas id="game" tabindex="0" role="img"
            aria-label="Basketball mini game. Hold space or press and hold the game to charge a shot, release to shoot."></canvas>
    <p class="hint">Hold <b>Space</b> (or press and hold the game) to charge, release to shoot. Swish = 3 pts, rim/backboard = 2 pts.</p>
  </div>

  <div class="actions">
    <button class="primary" type="button" onclick="location.reload()">Try again</button>
    <a class="btn" href="/">Go home</a>
    <a class="btn" href="/properties">Explore Properties</a>
  </div>
</main>

<script>
(function () {
  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      isDark = e.matches;
    });
  }

  // ---------- Shristi Estate logo mark (vector, offline-safe) ----------
  var NAVY = '#1e3350', GRAY = '#727982';
  var LOGO = [
    { d: 'M495 240L571 287V570H495Z',            f: NAVY },
    { d: 'M349 570V401L417 361V316L495 248',     s: NAVY, w: 16 },
    { d: 'M400 384L440 372V570H400Z',            f: NAVY },
    { d: 'M440 372L466 384V570H440Z',            f: GRAY },
    { d: 'M553 392H571V570H553Z',                f: GRAY },
    { d: 'M586 338L608 350V570H586Z',            f: NAVY },
    { d: 'M625 362L683 390V570H625Z',            f: GRAY }
  ];
  var LOGO_CX = 512.5, LOGO_BOTTOM = 572, LOGO_H = 334;

  document.getElementById('brandMark').innerHTML = LOGO.map(function (p) {
    return p.s
      ? '<path d="' + p.d + '" fill="none" stroke="' + p.s + '" stroke-width="' + p.w + '" stroke-linejoin="miter"/>'
      : '<path d="' + p.d + '" fill="' + p.f + '"/>';
  }).join('');

  var logoPaths = LOGO.map(function (p) { return { path: new Path2D(p.d), f: p.f, s: p.s, w: p.w }; });

  // ---------- canvas setup ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 640, H = 300, GROUND = 262;
  var dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * dpr; canvas.height = H * dpr;
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- constants ----------
  var G = 0.35, ANGLE = 58 * Math.PI / 180, COS = Math.cos(ANGLE), SIN = Math.sin(ANGLE);
  var R = 9;                       // ball radius
  var RIM_W = 46, RIM_Y = GROUND - 125;
  var SPAWN = { x: 92, y: 192 };
  var GAME_TIME = 60;

  // ---------- state ----------
  var state = 'idle';              // idle | running | over
  var last = 0, overAt = 0, frame = 0;
  var score = 0, timeLeft = GAME_TIME, hi = 0;
  try { hi = +localStorage.getItem('404bball-hi') || 0; } catch (e) {}

  var hoop = { x: 470, tx: 470, shake: 0 };
  var ball, charging = false, power = 0, powerDir = 1, sq = 0;
  var floaters = [];

  function newBall() {
    ball = { x: SPAWN.x, y: SPAWN.y, vx: 0, vy: 0, rot: 0, ready: true,
             touched: false, scored: false, respawn: null };
  }
  newBall();

  function resetGame() {
    score = 0; timeLeft = GAME_TIME; floaters = [];
    hoop.x = hoop.tx = 470; hoop.shake = 0;
    charging = false; power = 0; sq = 0;
    newBall();
  }

  // ---------- input ----------
  function press() {
    if (state === 'idle') { resetGame(); state = 'running'; last = performance.now(); return; }
    if (state === 'over') {
      if (performance.now() - overAt > 500) { resetGame(); state = 'running'; last = performance.now(); }
      return;
    }
    if (ball.ready && !charging) { charging = true; power = 0; powerDir = 1; }
  }
  function release() {
    if (!charging) return;
    charging = false;
    var v = 7 + 10 * power;
    ball.vx = v * COS; ball.vy = -v * SIN;
    ball.ready = false;
    sq = -0.12;                    // stretch on release
  }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); release(); }
  });
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    press();
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  // ---------- helpers ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pad(n) { return ('00' + Math.floor(n)).slice(-2); }

  // ---------- physics ----------
  function stepBall(dt) {
    var prevY = ball.y;
    ball.vy += G * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.rot += ball.vx * 0.06 * dt;

    // backboard
    var bbx = hoop.x + RIM_W / 2 + 8;
    if (ball.vx > 0 && ball.x + R > bbx && ball.x - R < bbx + 6 &&
        ball.y > RIM_Y - 70 && ball.y < RIM_Y + 8) {
      ball.x = bbx - R; ball.vx = -ball.vx * 0.55; ball.touched = true;
    }

    // rim end points
    [hoop.x - RIM_W / 2, hoop.x + RIM_W / 2].forEach(function (px) {
      var dx = ball.x - px, dy = ball.y - RIM_Y, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < R + 3 && dist > 0) {
        var nx = dx / dist, ny = dy / dist;
        ball.x = px + nx * (R + 3); ball.y = RIM_Y + ny * (R + 3);
        var vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) { ball.vx -= 1.6 * vn * nx; ball.vy -= 1.6 * vn * ny; }
        ball.touched = true;
      }
    });

    // scoring: crossing the rim plane downward, inside the rim
    if (!ball.scored && prevY < RIM_Y && ball.y >= RIM_Y && ball.vy > 0 &&
        Math.abs(ball.x - hoop.x) < RIM_W / 2 - 3) {
      ball.scored = true;
      var pts = ball.touched ? 2 : 3;
      score += pts;
      hoop.shake = 1;
      floaters.push({ x: hoop.x, y: RIM_Y - 30, t: ball.touched ? '+2' : '+3 SWISH!', life: 60 });
      if (ball.respawn === null) ball.respawn = 55;
      hoop.tx = rand(400, 565);
      while (Math.abs(hoop.tx - hoop.x) < 50) hoop.tx = rand(400, 565);
    }

    // ground
    if (ball.y + R > GROUND) {
      ball.y = GROUND - R;
      ball.vy *= -0.55; ball.vx *= 0.7;
      if (Math.abs(ball.vy) < 1.2) ball.vy = 0;
      if (ball.respawn === null) ball.respawn = 40;
    }
    // off screen
    if ((ball.x > W + 30 || ball.x < -30) && ball.respawn === null) ball.respawn = 10;
  }

  function update(dt) {
    timeLeft -= dt / 60;
    if (timeLeft <= 0) {
      timeLeft = 0; state = 'over'; overAt = performance.now(); charging = false;
      if (score > hi) { hi = score; try { localStorage.setItem('404bball-hi', String(hi)); } catch (e) {} }
      return;
    }

    if (charging) {
      power += powerDir * 0.014 * dt;
      if (power >= 1) { power = 1; powerDir = -1; }
      if (power <= 0) { power = 0; powerDir = 1; }
    }
    sq += ((charging ? 0.14 * power : 0) - sq) * Math.min(0.25 * dt, 1);

    hoop.x += (hoop.tx - hoop.x) * Math.min(0.1 * dt, 1);
    hoop.shake *= Math.pow(0.92, dt);

    if (!ball.ready) {
      var steps = Math.max(1, Math.ceil(dt)), sd = dt / steps;
      for (var i = 0; i < steps; i++) stepBall(sd);
      if (ball.respawn !== null) {
        ball.respawn -= dt;
        if (ball.respawn <= 0) newBall();
      }
    }

    floaters.forEach(function (f) { f.life -= dt; f.y -= 0.5 * dt; });
    floaters = floaters.filter(function (f) { return f.life > 0; });
  }

  // ---------- drawing ----------
  function drawLogo(cx, bottom, h, sx, sy) {
    var s = h / LOGO_H;
    ctx.save();
    ctx.translate(cx, bottom);
    ctx.scale(s * sx, s * sy);
    ctx.translate(-LOGO_CX, -LOGO_BOTTOM);
    logoPaths.forEach(function (p) {
      if (p.s) { ctx.strokeStyle = isDark ? '#7dd3fc' : p.s; ctx.lineWidth = p.w; ctx.lineJoin = 'miter'; ctx.stroke(p.path); }
      else { ctx.fillStyle = isDark && p.f === NAVY ? '#38bdf8' : p.f; ctx.fill(p.path); }
    });
    ctx.restore();
  }

  function drawBall(x, y, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#e8772e';
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a3510'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke();
    ctx.beginPath(); ctx.arc(-R * 1.15, 0, R * 0.85, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(R * 1.15, 0, R * 0.85, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    ctx.restore();
  }

  function drawTrajectory() {
    var v = 7 + 10 * power, x = SPAWN.x, y = SPAWN.y, vx = v * COS, vy = -v * SIN;
    ctx.fillStyle = isDark ? '#38bdf8' : NAVY;
    for (var i = 0; i < 160; i++) {
      vy += G; x += vx; y += vy;
      if (y > GROUND || x > W) break;
      if (i % 4 === 0) { ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  function drawHoop() {
    var hx = hoop.x, bbx = hx + RIM_W / 2 + 8;
    // pole + backboard
    ctx.fillStyle = isDark ? '#334155' : '#c3c7ce';
    ctx.fillRect(bbx + 14, RIM_Y - 10, 6, GROUND - RIM_Y + 10);
    ctx.fillRect(bbx + 2, RIM_Y - 4, 14, 4);
    ctx.fillStyle = isDark ? '#64748b' : GRAY;
    ctx.fillRect(bbx, RIM_Y - 70, 6, 78);
    ctx.fillStyle = isDark ? '#38bdf8' : NAVY;
    ctx.fillRect(bbx, RIM_Y - 70, 6, 6);
  }
  function drawRimAndNet() {
    var hx = hoop.x, l = hx - RIM_W / 2, r = hx + RIM_W / 2;
    var sh = Math.sin(frame * 0.9) * hoop.shake * 4;
    // net
    ctx.strokeStyle = isDark ? '#94a3b8' : '#9aa0aa'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(l + 2, RIM_Y); ctx.lineTo(l + 11 + sh, RIM_Y + 28);
    ctx.moveTo(r - 2, RIM_Y); ctx.lineTo(r - 11 + sh, RIM_Y + 28);
    ctx.moveTo(hx - 8, RIM_Y); ctx.lineTo(hx - 3 + sh, RIM_Y + 28);
    ctx.moveTo(hx + 8, RIM_Y); ctx.lineTo(hx + 3 + sh, RIM_Y + 28);
    ctx.moveTo(l + 6, RIM_Y + 10); ctx.lineTo(r - 6, RIM_Y + 10);
    ctx.moveTo(l + 9 + sh * 0.5, RIM_Y + 20); ctx.lineTo(r - 9 + sh * 0.5, RIM_Y + 20);
    ctx.moveTo(l + 11 + sh, RIM_Y + 28); ctx.lineTo(r - 11 + sh, RIM_Y + 28);
    ctx.stroke();
    // rim
    ctx.strokeStyle = '#e5484d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l, RIM_Y); ctx.lineTo(r, RIM_Y); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // faint 404 backdrop
    ctx.textAlign = 'center';
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(30,51,80,0.06)';
    ctx.font = '800 130px system-ui, sans-serif';
    ctx.fillText('404', W / 2, 170);

    // floor
    ctx.fillStyle = isDark ? '#0f172a' : '#e2e8f0';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = isDark ? '#1e293b' : '#cbd5e1';
    ctx.fillRect(0, GROUND, W, 2);

    drawHoop();
    if (charging) drawTrajectory();

    // player (logo)
    var sx = 1 + sq * 0.6, sy = 1 - sq;
    drawLogo(56, GROUND, 82, sx, sy);

    // ball
    drawBall(ball.x, ball.ready && charging ? ball.y + sq * 20 : ball.y, ball.rot);

    drawRimAndNet();

    // power bar
    if (charging) {
      ctx.fillStyle = isDark ? '#1e293b' : '#cbd5e1';
      ctx.fillRect(16, GROUND + 16, 170, 10);
      ctx.fillStyle = power > 0.4 && power < 0.78 ? '#10b981' : (isDark ? '#38bdf8' : NAVY);
      ctx.fillRect(16, GROUND + 16, 170 * power, 10);
      ctx.fillStyle = isDark ? '#94a3b8' : '#64748b'; ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('POWER', 16, GROUND + 13);
    }

    // HUD
    ctx.font = '700 16px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = isDark ? '#f8fafc' : NAVY; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + ('000' + score).slice(-3), 14, 26);
    ctx.textAlign = 'center';
    ctx.fillStyle = timeLeft < 10 && state === 'running' ? '#ef4444' : (isDark ? '#f8fafc' : NAVY);
    ctx.fillText('0:' + pad(Math.ceil(timeLeft)), W / 2, 26);
    ctx.textAlign = 'right'; ctx.fillStyle = isDark ? '#94a3b8' : '#64748b';
    ctx.fillText('HI ' + ('000' + hi).slice(-3), W - 14, 26);

    // floating text
    ctx.textAlign = 'center';
    floaters.forEach(function (f) {
      ctx.globalAlpha = Math.min(1, f.life / 30);
      ctx.fillStyle = '#10b981'; ctx.font = '800 20px system-ui, sans-serif';
      ctx.fillText(f.t, f.x, f.y);
    });
    ctx.globalAlpha = 1;

    // overlays
    if (state === 'idle' || state === 'over') {
      ctx.fillStyle = isDark ? 'rgba(7, 12, 30, 0.94)' : 'rgba(248, 250, 252, 0.94)';
      ctx.fillRect(0, 60, W, 110);
      ctx.textAlign = 'center';
      if (state === 'idle') {
        ctx.fillStyle = isDark ? '#f8fafc' : NAVY; ctx.font = '800 24px system-ui, sans-serif';
        ctx.fillText('Shristi Estate Hoops', W / 2, 102);
        ctx.fillStyle = isDark ? '#94a3b8' : '#64748b'; ctx.font = '500 14px system-ui, sans-serif';
        ctx.fillText('Press Space or tap to start  ·  60 seconds', W / 2, 128);
        ctx.fillText('Hold to charge, release to shoot', W / 2, 148);
      } else {
        ctx.fillStyle = isDark ? '#f8fafc' : NAVY; ctx.font = '800 24px system-ui, sans-serif';
        ctx.fillText("TIME'S UP  ·  Score " + score, W / 2, 102);
        ctx.fillStyle = isDark ? '#94a3b8' : '#64748b'; ctx.font = '500 14px system-ui, sans-serif';
        ctx.fillText(score >= hi && score > 0 ? 'New high score!' : 'Best: ' + hi, W / 2, 128);
        ctx.fillText('Press Space or tap to play again', W / 2, 148);
      }
    }
  }

  // ---------- loop ----------
  function loop(now) {
    var dt = Math.min((now - last) / 16.667, 3);
    last = now; frame += dt;
    if (state === 'running') update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(function (t) { last = t; loop(t); });
  document.addEventListener('visibilitychange', function () { last = performance.now(); });

  // ---------- connection status ----------
  var statusEl = document.getElementById('status');
  function updateStatus() {
    statusEl.className = '';
    statusEl.textContent = navigator.onLine === false
      ? "You're offline. Play while you wait, we'll tell you when you're back."
      : "The page you're looking for doesn't exist or has moved.";
  }
  window.addEventListener('offline', updateStatus);
  window.addEventListener('online', function () {
    statusEl.className = 'online';
    statusEl.textContent = "You're back online. Hit “Try again” to reload.";
  });
  updateStatus();
})();
</script>
</body>
